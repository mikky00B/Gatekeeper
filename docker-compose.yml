services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GATEWAY_ADDR: ":8080"
      GATEWAY_UPSTREAM: "http://upstream:3000"
      GATEWAY_WATCHDOG_UPSTREAM: "http://host.docker.internal:5173/"
      GATEWAY_DB_ENABLED: "true"
      GATEWAY_DB_DRIVER: "postgres"
      GATEWAY_DB_DSN: "postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable"
      GATEWAY_REDIS_ENABLED: "true"
      GATEWAY_REDIS_ADDR: "redis:6379"
      GATEWAY_JWT_SECRET: "change-me-local-secret"
      GATEWAY_ANALYTICS_PERSISTENT: "true"
      GATEWAY_ADMIN_ENABLED: "true"
      GATEWAY_ADMIN_TOKEN: "local-admin-token"
    depends_on:
      - upstream
      - postgres
      - redis

  upstream:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:3000", "-text=upstream ok"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./internal/db/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
